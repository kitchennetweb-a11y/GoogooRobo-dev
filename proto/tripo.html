<script>
'use strict';
// Dev test page: plays the Tripo auto-rig clips with three's AnimationMixer exactly as stored (no retargeting),
// plus the procedural dance from index.html mapped onto the Mixamo bones. Room code is copied verbatim from index.html.
const TEST=/[?&]test/.test(location.search);if(TEST)document.body.classList.add('test');
// ---------- Sound (same synth as the game's SFX / music) ----------
let AC=null;const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f1,f2,dur,type='sine',vol=.25,delay=0){const a=ac(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const SFX={
  boing:()=>tone(180,700,.35,'triangle',.3),
  giggle:()=>{for(let i=0;i<5;i++)tone(700+(i%2)*200,900,.08,'sine',.2,i*.1)},
  beep:()=>{tone(880,880,.08,'square',.1);tone(1320,1320,.1,'square',.1,.1)},
  dizzy:()=>{for(let i=0;i<6;i++)tone(500+i*120,300+i*60,.12,'triangle',.15,i*.09)},
};
let musicTimer=null;
function music(on){clearInterval(musicTimer);if(!on)return;const notes=[523,659,784,659,587,698,880,698];let i=0;
  musicTimer=setInterval(()=>{tone(notes[i%8],notes[i%8],.18,'square',.07);if(i%2==0)tone(130,60,.12,'sine',.35);i++},220)}
// voice clips: the mouth follows the clip's loudness through an AnalyserNode
const VOICE={};let voiceSrc=null,analyser=null,abuf=null,vPeak=.02;
const loadVoice=k=>VOICE[k]||(VOICE[k]=fetch('../audio/'+k+'.mp3').then(r=>{if(!r.ok)throw r.status;return r.arrayBuffer()})
  .then(b=>new Promise((ok,no)=>ac().decodeAudioData(b,ok,no))).catch(e=>{delete VOICE[k];console.warn('voice',k,e);return null}));
async function playVoice(k){const b=await loadVoice(k);if(!b)return 0;const a=ac();try{voiceSrc&&voiceSrc.stop()}catch(e){}
  if(!analyser){analyser=a.createAnalyser();analyser.fftSize=512;abuf=new Float32Array(analyser.fftSize);analyser.connect(a.destination)}
  const s=a.createBufferSource();s.buffer=b;s.connect(analyser);s.start();voiceSrc=s;vPeak=.02;s.onended=()=>{if(voiceSrc===s)voiceSrc=null};return b.duration}
function voiceLevel(){if(!voiceSrc)return 0;analyser.getFloatTimeDomainData(abuf);let r=0;for(const v of abuf)r+=v*v;r=Math.sqrt(r/abuf.length);
  vPeak=Math.max(vPeak*.995,r);return Math.min(1,r/(vPeak*.8))} // normalised to the clip's own peak, so whispers move the mouth as much as normal lines

// ---------- Renderer, scene, room (from the game: wood floor, rug, painted walls, window with day/night sky) ----------
const SMALL=Math.min(screen.width,screen.height)<500;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=SMALL?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;
document.getElementById('view').prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9dccb);
const camera=new THREE.PerspectiveCamera(45,1,.1,60);
const hemi=new THREE.HemisphereLight(0xdfeeff,0xb08a5e,.3);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dc,.95);sun.position.set(-3.5,9,5.5);sun.castShadow=true; // the one shadow-casting light
sun.shadow.mapSize.setScalar(SMALL?1024:2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,far:30});scene.add(sun);
const fill=new THREE.DirectionalLight(0xffe2c4,.18);fill.position.set(5,4,8);scene.add(fill);
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
const rnd=(a,b)=>a+Math.random()*(b-a),M=(c,r=.45,m=.1)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function part(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m}
const room=new THREE.Group();scene.add(room);
const RW=16,RD=13,RH=7,BACK=-5.2;
const woodTex=canvasTex(1024,1024,(x,w,h)=>{const rows=8,ph=h/rows;
  for(let r=0;r<rows;r++){let xo=-rnd(0,w*.6);while(xo<w){const len=rnd(w*.35,w*.7),b=[rnd(176,206),rnd(128,150),rnd(86,104)];
      x.fillStyle=`rgb(${b[0]|0},${b[1]|0},${b[2]|0})`;x.fillRect(xo,r*ph,len,ph);
      for(let g=0;g<26;g++){const y=r*ph+rnd(2,ph-2);x.strokeStyle=`rgba(90,55,30,${rnd(.04,.13)})`;x.lineWidth=rnd(.6,2);x.beginPath();
        x.moveTo(xo,y);for(let s=0;s<=8;s++)x.lineTo(xo+len*s/8,y+Math.sin(s*rnd(.5,1.3)+g)*rnd(1,4));x.stroke()}
      x.fillStyle='rgba(60,35,18,.55)';x.fillRect(xo,r*ph,2,ph);xo+=len}
    x.fillStyle='rgba(60,35,18,.6)';x.fillRect(0,r*ph,w,2)}},[3,3]);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),new THREE.MeshStandardMaterial({map:woodTex,roughness:.55}));
floor.rotation.x=-Math.PI/2;floor.position.set(0,0,BACK+RD/2);floor.receiveShadow=true;room.add(floor);
const rugTex=canvasTex(1024,1024,(x,w)=>{const cx=w/2,cols=['#e76f51','#f4a261','#fbe8c8','#2a9d8f','#f4a261','#fbe8c8','#e76f51','#e9c46a'];
  for(let i=0;i<cols.length;i++){x.fillStyle=cols[i];x.beginPath();x.arc(cx,cx,cx*(1-i/cols.length),0,7);x.fill()}
  for(let k=0;k<9000;k++){const a=rnd(0,7),r=rnd(0,cx);x.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'60,30,20'},${rnd(.03,.08)})`;x.fillRect(cx+Math.cos(a)*r,cx+Math.sin(a)*r,rnd(2,5),1.5)}
  x.strokeStyle='rgba(255,255,255,.5)';x.setLineDash([6,8]);x.lineWidth=3;x.beginPath();x.arc(cx,cx,cx-10,0,7);x.stroke()});
const rug=new THREE.Mesh(new THREE.CircleGeometry(3.4,64),new THREE.MeshStandardMaterial({map:rugTex,roughness:.95}));
rug.rotation.x=-Math.PI/2;rug.position.y=.008;rug.receiveShadow=true;room.add(rug);
const wallTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#e8d9c4';x.fillRect(0,0,w,h);
  for(let k=0;k<5000;k++){x.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'120,90,60'},${rnd(.015,.045)})`;x.fillRect(rnd(0,w),rnd(0,h),rnd(2,8),rnd(2,8))}},[3,2]);
const wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.92,color:0x6f9cff}); // bedroom wall colour (game: WALL.bed)
const backW=new THREE.Mesh(new THREE.PlaneGeometry(RW,RH),wallMat);backW.position.set(0,RH/2,BACK);backW.receiveShadow=true;room.add(backW);
for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.PlaneGeometry(RD,RH),wallMat);w.rotation.y=-s*Math.PI/2;w.position.set(s*RW/2,RH/2,BACK+RD/2);w.receiveShadow=true;room.add(w)}
const skirt=new THREE.Mesh(new THREE.BoxGeometry(RW,.28,.06),M(0xfaf6ef,.5));skirt.position.set(0,.14,BACK+.03);room.add(skirt);
const skyTex=canvasTex(256,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#8fc8f0');g.addColorStop(.75,'#d6eefb');g.addColorStop(1,'#bfe0c0');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,255,255,.9)';for(const [cx,cy,r] of[[70,70,22],[95,62,28],[125,72,20],[190,110,16],[210,104,20]]){x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
  x.fillStyle='#7fb069';x.beginPath();x.moveTo(0,h);x.quadraticCurveTo(w*.3,h*.72,w*.6,h*.85);x.quadraticCurveTo(w*.85,h*.75,w,h*.8);x.lineTo(w,h);x.fill()});
const nightTex=canvasTex(256,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0b1236');g.addColorStop(1,'#2a3570');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='#fff';for(let i=0;i<40;i++){x.globalAlpha=.4+Math.random()*.6;x.beginPath();x.arc(Math.random()*w,Math.random()*h*.75,Math.random()*1.6+.4,0,7);x.fill()}
  x.globalAlpha=1;x.fillStyle='#fff6c8';x.shadowColor='#fff6c8';x.shadowBlur=18;x.beginPath();x.arc(180,70,26,0,7);x.fill();
  x.shadowBlur=0;x.fillStyle='#0b1236';x.beginPath();x.arc(194,62,24,0,7);x.fill();
  x.fillStyle='#1d3a2c';x.beginPath();x.moveTo(0,h);x.quadraticCurveTo(w*.3,h*.72,w*.6,h*.85);x.quadraticCurveTo(w*.85,h*.75,w,h*.8);x.lineTo(w,h);x.fill()});
const WX=-1.2,WY=3.9,WW=3.2,WH=2.4;
const skyMat=new THREE.MeshBasicMaterial({map:skyTex,toneMapped:false});
const sky=new THREE.Mesh(new THREE.PlaneGeometry(WW,WH),skyMat);sky.position.set(WX,WY,BACK+.01);room.add(sky);
const frameMat=M(0xffffff,.45);
const bar=(w,h,x,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.12),frameMat);m.position.set(x,y,BACK+.06);room.add(m)};
bar(WW+.24,.14,WX,WY+WH/2);bar(WW+.24,.14,WX,WY-WH/2);bar(.14,WH,WX-WW/2,WY);bar(.14,WH,WX+WW/2,WY);bar(.08,WH,WX,WY);bar(WW,.08,WX,WY);
const sill=new THREE.Mesh(new THREE.BoxGeometry(WW+.6,.1,.4),frameMat);sill.position.set(WX,WY-WH/2-.1,BACK+.2);room.add(sill);
const curtainMat=new THREE.MeshStandardMaterial({color:0x7aa7c7,roughness:.9,side:THREE.DoubleSide});
for(const s of[-1,1]){const cg=new THREE.PlaneGeometry(.9,WH+1.1,12,1),pa=cg.attributes.position;for(let i=0;i<pa.count;i++)pa.setZ(i,Math.sin(pa.getX(i)*14)*.07);cg.computeVertexNormals();
  const cu=new THREE.Mesh(cg,curtainMat);cu.position.set(WX+s*(WW/2+.45),WY-.25,BACK+.18);room.add(cu)}
const windowGlow=new THREE.PointLight(0xcfe8ff,.45,9,2);windowGlow.position.set(WX,WY,BACK+1.2);scene.add(windowGlow);
let dayEnv;(function(){const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene(); // soft room reflections, as in the game
  es.add(new THREE.Mesh(new THREE.BoxGeometry(20,10,20),new THREE.MeshBasicMaterial({color:0x5e5244,side:THREE.BackSide})));
  const win=new THREE.Mesh(new THREE.PlaneGeometry(6,4),new THREE.MeshBasicMaterial({color:0xbfc8d0}));win.position.set(-2,4,-9.9);es.add(win);
  dayEnv=pm.fromScene(es,.04).texture;scene.environment=dayEnv;pm.dispose()})();
// furniture (bed, lamp, night stand); x0 = wanted x, pulled in on narrow screens by resize()
const furn=new THREE.Group();scene.add(furn);
function add(id,g,x,z,ry=0){g.position.set(x,0,z);g.rotation.y=ry;g.traverse(o=>{o.userData.furn=id;if(o.isMesh)o.castShadow=o.receiveShadow=true});g.userData.x0=x;furn.add(g);
  const bb=new THREE.Box3().setFromObject(g),sz=new THREE.Vector3(),c=new THREE.Vector3();bb.getSize(sz);bb.getCenter(c);g.worldToLocal(c); // invisible tap box
  const hb=new THREE.Mesh(new THREE.BoxGeometry(sz.x+.3,sz.y+.3,sz.z+.3),new THREE.MeshBasicMaterial({visible:false}));hb.position.copy(c);hb.rotation.y=-ry;hb.userData.furn=id;g.add(hb);return g}
function rbox(w,h,d,r,mat){w-=2*r;h-=2*r;const rr=r;r=Math.min(w,h)*.25;const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-rr*2,bevelEnabled:true,bevelThickness:rr,bevelSize:rr*.95,bevelSegments:4,curveSegments:8});g.translate(0,0,-(d-rr*2)/2);return new THREE.Mesh(g,mat)}
const dark=M(0x8a5a33,.7);
{const bed=new THREE.Group(),fr=rbox(2.2,.45,1.3,.1,dark);fr.position.y=.32;bed.add(fr);
  const mt=rbox(2.05,.25,1.2,.12,M(0xf6f1e7,.9));mt.position.y=.62;bed.add(mt);
  const bl=rbox(1.3,.12,1.24,.08,M(0x5aa9ff,.8));bl.position.set(.35,.75,0);bed.add(bl);
  const pi=rbox(.5,.18,.8,.09,M(0xffffff,.9));pi.position.set(-.75,.8,0);bed.add(pi);
  const hd=rbox(.14,1.1,1.3,.06,dark);hd.position.set(-1.1,.6,0);bed.add(hd);add('bed',bed,3.2,-3.3,-.35)}
const shadeMat=new THREE.MeshStandardMaterial({color:0xffe08a,emissive:0xffc94d,emissiveIntensity:.6,roughness:.6,side:THREE.DoubleSide});
const lamp=new THREE.Group();lamp.add(part(new THREE.CylinderGeometry(.3,.36,.08,24),M(0x3d4a63,.5),0,.04,0));
lamp.add(part(new THREE.CylinderGeometry(.04,.04,1.6,10),M(0x3d4a63,.5),0,.84,0));lamp.add(part(new THREE.CylinderGeometry(.28,.45,.5,24,1,true),shadeMat,0,1.75,0));
add('lamp',lamp,-3.2,-3.6);
const lampLight=new THREE.PointLight(0xffc77a,0,8,2);lampLight.position.set(0,1.6,0);lamp.add(lampLight);
{const ns=new THREE.Group();ns.add(part(new THREE.BoxGeometry(.7,.62,.55),M(0xf4f7fb,.6),0,.31,0));ns.add(part(new THREE.SphereGeometry(.04,8,6),M(0xffc93c,.4),0,.4,.29));add('nightstand',ns,1.6,-4.4,-.2)}
// day / night (the game's ROOM_DAY / ROOM_NIGHT, plus a soft moon fill so Googoo is still readable)
const DAY={bg:0xe9dccb,sun:.95,hemi:.3,win:.45,fill:.18,exp:.9},NIGHT={bg:0x2b2f45,sun:.05,hemi:.1,win:0,fill:.06,exp:.85};
let lightsOn=true;
function setLights(on){lightsOn=on;const L=on?DAY:NIGHT;sun.intensity=L.sun;hemi.intensity=L.hemi;windowGlow.intensity=L.win;fill.intensity=L.fill;
  renderer.toneMappingExposure=L.exp;scene.background.setHex(L.bg);scene.environment=on?dayEnv:null;skyMat.map=on?skyTex:nightTex;skyMat.needsUpdate=true;
  shadeMat.emissiveIntensity=on?.6:2.2;lampLight.intensity=on?0:1.8;document.querySelector('meta[name=theme-color]').content=on?'#e9dccb':'#2b2f45'}

// ---------- Face screen: the approved face kit (layers pre-warped for the screen UVs), composed on a canvas ----------
// face_kit.json: full canvas = screen UV 0..1, top row = glTF v=0, so flipY=false. Layers are downscaled 2048->1024, offsets scaled by FKS.
const FKS=.5,fc=document.createElement('canvas');fc.width=1024;fc.height=688;const fx=fc.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=fc.width;tmp.height=fc.height;const tx=tmp.getContext('2d');
const faceTex=new THREE.CanvasTexture(fc);faceTex.encoding=THREE.sRGBEncoding;faceTex.flipY=false;faceTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
let KIT=null;const LAYER={};
fetch('facekit/face_kit.json').then(r=>r.json()).then(k=>{const need=new Set(['screen_bg']);
  for(const n of['neutral','happy','laugh','talk_1','talk_2','talk_3','blink_half','blink'])for(const l of k.expressions[n].layers){need.add(l.layer);l.clip&&need.add(l.clip)}
  return Promise.all([...need].map(n=>new Promise(ok=>{const im=new Image();im.onload=()=>{LAYER[n]=im;ok()};im.onerror=()=>{console.warn('layer',n);ok()};im.src='facekit/'+k.layers[n]}))).then(()=>KIT=k)});
let faceKey='';
function compose(name,gx,gy){if(!KIT)return;const key=name+(gx|0)+','+(gy|0);if(key===faceKey)return;faceKey=key;
  const W=fc.width,Hh=fc.height;fx.clearRect(0,0,W,Hh);LAYER.screen_bg&&fx.drawImage(LAYER.screen_bg,0,0,W,Hh);
  for(const l of KIT.expressions[name].layers){const im=LAYER[l.layer];if(!im)continue;const o=l.offset||[0,0];
    if(l.clip){tx.globalCompositeOperation='source-over';tx.clearRect(0,0,W,Hh);tx.drawImage(im,(o[0]+gx)*FKS,(o[1]+gy)*FKS,W,Hh); // gaze shifts the pupils, the mask keeps them inside the eye whites
      tx.globalCompositeOperation='destination-in';tx.drawImage(LAYER[l.clip],0,0,W,Hh);tx.globalCompositeOperation='source-over';fx.drawImage(tmp,0,0)}
    else fx.drawImage(im,o[0]*FKS,o[1]*FKS,W,Hh)}
  faceTex.needsUpdate=true}
const gaze={x:0,y:0,tx:0,ty:0,next:0};let blinkT=-1,nextBlink=2,faceForce='',faceUntil=0;
function faceFrame(t,dt,now,talk){ // talk: 0..1 mouth level (voice or a sing clip), <0 = silent
  if(t>gaze.next){const m=KIT?KIT.pupils.max_offset_px:[63,54];gaze.tx=rnd(-.85,.85)*m[0];gaze.ty=rnd(-.7,.7)*m[1];gaze.next=t+rnd(1.2,3.2)}
  const k=Math.min(1,dt*9);gaze.x+=(gaze.tx-gaze.x)*k;gaze.y+=(gaze.ty-gaze.y)*k;
  let f=now<faceUntil?faceForce:'neutral';
  if(f==='neutral'&&talk>=0)f=talk<.12?'neutral':talk>.6?'talk_1':talk>.33?'talk_3':'talk_2';
  if(t>nextBlink){blinkT=t;nextBlink=t+rnd(2.2,5)}
  const bi=Math.floor((t-blinkT)/.045),SEQ=['blink_half','blink','blink','blink_half'];
  if(blinkT>=0&&bi<SEQ.length&&f!=='laugh')f=SEQ[bi];
  compose(f,gaze.x,gaze.y)}
const setFace=(f,ms)=>{faceForce=f;faceUntil=performance.now()+ms};

// ---------- Googoo (Tripo auto-rig, Mixamo skeleton) ----------
const H=2.7,V3=()=>new THREE.Vector3(),SIDES=['Left','Right'],SG={Left:1,Right:-1}; // his left is +x, he faces +z
const googoo=new THREE.Group();scene.add(googoo);
let model=null,RIG=null,mixer=null,HT=1,ready=false,mode='rest',cur='',speed=1,paused=false;
const ACT={},B={},REST={},RESTP={},LEGP={},SH0={},FLX={},FING={Left:[],Right:[]};
function mQ(b,q){q.identity();for(let o=b;o!==RIG;o=o.parent)q.premultiply(o.quaternion);return q}

  pose(n,t){mode='clip';cur=n;mixer.stopAllAction();toRest();const a=ACT[n];a.reset().setLoop(THREE.LoopOnce,1).play();a.clampWhenFinished=true;mixer.setTime(Math.min(t,a.getClip().duration))},
  rest(){mode='rest';mixer.stopAllAction();toRest()},
  proc(st,t){mixer.stopAllAction();mode='proc';style=st;SP={};danceT0=0;for(let x=0;x<=t;x+=1/60)animate(x,1/60)},
  cam(i){camI=i;placeCam()},
  render(face){compose(face||'neutral',0,0);renderer.render(scene,camera)},
  measure(n){const a=ACT[n],N=Math.floor(a.getClip().duration*24+1e-6)+1;return legStats(N,i=>this.pose(n,i/24))},
  measureProc(st,secs){mixer.stopAllAction();mode='proc';style=st;SP={};danceT0=0;let x=0;return legStats(Math.round(secs*24),i=>{for(;x<=i/24;x+=1/120)animate(x,1/120)})},
  restStats(){return legStats(1,()=>toRest())},
  rest_info(){toRest();return{HT,hips:RESTP.Hips.y,legs:SIDES.map(s=>[LEGP[s].A0.toArray(),LEGP[s].T0.toArray()])}}};
</script>
